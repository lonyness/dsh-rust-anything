name: Test
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify and extract upstream rust-anything v3.3.0
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          read -r file sha member exe_sha < <(node -e '
            const m = require("./runtime/upstream-v3.3.0.json").platforms[process.platform + "-" + process.arch];
            console.log(m.archive, m.archiveSha256, m.member, m.executableSha256)')
          cd "$(mktemp -d "$RUNNER_TEMP/rust-anything.XXXXXX")"
          curl --proto '=https' --fail --location --silent --show-error --retry 3 \
            -o "$file" "https://github.com/erkamyaman/rust-anything/releases/download/v3.3.0/$file"
          printf '%s  %s\n' "$sha" "$file" | shasum -a 256 -c -
          tar -xzf "$file" "$member"
          printf '%s  %s\n' "$exe_sha" "$member" | shasum -a 256 -c -
          test -x "$member"
          echo "DSH_RUST_ANYTHING_BIN=$PWD/$member" >> "$GITHUB_ENV"
      - name: Check all official assets, then pack and verify the Windows EXE in the candidate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $assets = Join-Path $env:RUNNER_TEMP 'upstream-v3.3.0'
          gh release download v3.3.0 -R erkamyaman/rust-anything -D $assets
          python test/verify_release.py $assets --pack-to "$env:RUNNER_TEMP/candidate"
      - run: npm test
